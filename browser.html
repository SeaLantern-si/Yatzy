<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="YatzyStyleSheet.css">
    <script src="YatzyFunctions.js" defer></script>
    <title>Yatzy</title>
</head>

<body>
    <div class="diceDiv">
        <span id="Dice">
            <img src="img/1.svg" id="Dice1">
            <img src="img/2.svg" id="Dice2">
            <img src="img/3.svg" id="Dice3">
            <img src="img/4.svg" id="Dice4">
            <img src="img/5.svg" id="Dice5">
      
        </span>

        <span id="DiceRoll">
            <label for="Turn1" id="Turn">Turn</label>
            <button id="Roll">Roll dice</button>
        </span>


    </div>
    <div class="resultsDiv">
        <div class="Singels">
            <span id="s1"><label for="">1'er</label><input type="text" id="1er"></span>
            <span id="s2"><label for="">2'er</label><input type="text" id="2er"></span>
            <span id="s3"><label for="">3'er</label><input type="text" id="3er"></span>
            <span id="s4"><label for="">4'er</label><input type="text" id="4er"></span>
            <span id="s5"><label for="">5'er</label><input type="text" id="5er"></span>
            <span id="s6"><label for="">6'er</label><input type="text" id="6er"></span>
            <span id="s7"><label for="">One Pair</label><input type="text" id="OnePair"></span>
            <span id="s8"><label for="">Two Pair</label><input type="text" id="TwoPair"></span>
            <span id="s9"><label for="">Three Same</label><input type="text" id="ThreeSame"></span>
            <span id="s10"><label for="">Four Same</label><input type="text" id="FourSame"></span>
            <span id="s11"><label for="">Full House</label><input type="text"></span>
            <span id="s12"><label for="">Small Straight</label><input type="text"></span>
            <span id="s13"><label for="">Large Straight</label><input type="text"></span>
            <span id="s14"><label for="">Chance</label><input type="text"></span>
            <span id="s15"><label for="">Yatzy</label><input type="text"></span>
        </div>
        <span id="sSum" class="sSum"><label for="">Sum</label><input type="text"></span>
        <span id="sBonus" class="sBonus"><label for="">Bonus</label><input type="text"></span>
        <span id="sTotal" class="total"><label for="">Total</label><input type="text"></span>
    </div>
</body>

</html>
