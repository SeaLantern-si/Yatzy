<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="YatzyStyleSheet.css">
    <script src="YatzyFunctions.js" defer></script>
    <title>Yatzy</title>
</head>

<body>
    <div class="diceDiv">
        <span id="Dice">
            <img src="img/1.svg" id="Dice1">
            <img src="img/2.svg" id="Dice2">
            <img src="img/3.svg" id="Dice3">
            <img src="img/4.svg" id="Dice4">
            <img src="img/5.svg" id="Dice5">
      
        </span>

        <span id="DiceRoll">
            <label for="Turn1" id="Turn">Turn</label>
            <button id="Roll">Roll dice</button>
        </span>


    </div>
    <div class="resultsDiv">
        <div class="Singels">
            <span id="s1"><label for="ener">1'er</label><input type="text" id="ener"></span>
            <span id="s2"><label for="toer">2'er</label><input type="text" id="toer"></span>
            <span id="s3"><label for="treer">3'er</label><input type="text" id="treer"></span>
            <span id="s4"><label for="firer">4'er</label><input type="text" id="firer"></span>
            <span id="s5"><label for="fem">5'er</label><input type="text" id="fem"></span>
            <span id="s6"><label for="seks">6'er</label><input type="text" id="seks"></span>
            <span id="s7"><label for="OnePair">One Pair</label><input type="text" id="OnePair"></span>
            <span id="s8"><label for="TwoPair">Two Pair</label><input type="text" id="TwoPair"></span>
            <span id="s9"><label for="ThreeSame">Three Same</label><input type="text" id="ThreeSame"></span>
            <span id="s10"><label for="FourSame">Four Same</label><input type="text" id="FourSame"></span>
            <span id="s11"><label for="FullHouse">Full House</label><input type="text" id="FullHouse"></span>
            <span id="s12"><label for="SmallS">Small Straight</label><input type="text" id="SmallS"></span>
            <span id="s13"><label for="LargeS">Large Straight</label><input type="text" id="LargeS"></span>
            <span id="s14"><label for="Chance">Chance</label><input type="text" id="Chance"></span>
            <span id="s15"><label for="Yatzy">Yatzy</label><input type="text" id="Yatzy"></span>
        </div>
        <span id="sSum" class="sSum"><label for="Sum">Sum</label><input type="text" id="Sum"></span>
        <span id="sBonus" class="sBonus"><label for="Bonus">Bonus</label><input type="text" id="Bonus"></span>
        <span id="sTotal" class="total"><label for="Total">Total</label><input type="text" id="Total"></span>
    </div>
</body>

</html>
